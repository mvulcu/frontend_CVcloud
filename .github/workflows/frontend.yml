name: Deploy to Google Cloud Storage

# The GCP project has been decommissioned: deployment runs only when started manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Google Cloud Storage
        run: gsutil cp ./frontend/* gs://cvbucket/

      - name: Invalidate Cloud CDN cache
        run: gcloud compute url-maps invalidate-cdn-cache cvcloud-lb --path "/*" --async
